name: FieldOps Mobile Release Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Git Commit SHA or Tag to build'
        required: true
        default: 'v1.0.0-rc.1'
      release_channel:
        description: 'Target Release Channel (pilot, internal, production)'
        required: true
        default: 'pilot'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android Release Artifacts (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Repository at Specified Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_commit || github.ref }}
          fetch-depth: 0

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Tools & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708 # latest commandline tools

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=API_URL=https://staging-api.fieldops.com

      - name: Build Android Release App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=API_URL=https://staging-api.fieldops.com

      - name: Compute Artifact Hashes (SHA-256)
        run: |
          mkdir -p ../../dist/android
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/android/fieldops-v1.0.0-rc.1.apk || true
          cp build/app/outputs/bundle/release/app-release.aab ../../dist/android/fieldops-v1.0.0-rc.1.aab || true
          cd ../../dist/android
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Archive Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fieldops-android-v1.0.0-rc.1
          path: |
            dist/android/*.apk
            dist/android/*.aab
            dist/android/SHA256SUMS.txt
          retention-days: 30

  build-ios:
    name: Build iOS Release Artifacts (IPA & dSYMs)
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Repository at Specified Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_commit || github.ref }}
          fetch-depth: 0

      - name: Select Xcode 15.4
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Install Apple Distribution Certificate & Profile
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'fieldops-ci-keychain' }}
        run: |
          # Create temporary CI keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import distribution certificate
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Install mobile provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision

      - name: Build iOS Release Archive (IPA)
        run: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --dart-define=ENVIRONMENT=staging \
            --dart-define=API_URL=https://staging-api.fieldops.com \
            --export-options-plist=ios/ExportOptions.plist || flutter build ios --release --no-codesign

      - name: Compute Artifact Hashes (SHA-256)
        run: |
          mkdir -p ../../dist/ios
          cp build/ios/ipa/*.ipa ../../dist/ios/fieldops-v1.0.0-rc.1.ipa || true
          cp -r build/ios/archive/Runner.xcarchive/dSYMs ../../dist/ios/ || true
          cd ../../dist/ios
          sha256sum * 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Archive iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fieldops-ios-v1.0.0-rc.1
          path: |
            dist/ios/*.ipa
            dist/ios/SHA256SUMS.txt
          retention-days: 30
